<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>沖縄手帳 Web版プレ</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="cover">
  <div class="coverInner">
    <div class="brand">OKINAWA TECHO WEB PREVIEW</div>
    <h1>沖縄手帳<br>Web版プレ</h1>
    <p>紙の沖縄手帳の情報を、スマホで読みやすく。月表示はシンプルに、日付を押すと旧暦・六曜・行事を詳しく確認できます。</p>
    <a href="#app" class="startBtn">月間カレンダーを開く</a>
  </div>
</header>

<main id="app" class="app">
  <section class="monthHeader">
    <div>
      <div class="small">2027 / OKINAWA TECHO</div>
      <h2 id="monthTitle">1月</h2>
      <p id="monthMeta"></p>
    </div>
    <select id="monthSelect" aria-label="月を選択"></select>
  </section>

  <section class="seasonBox">
    <div class="small">沖縄季節暦</div>
    <p id="seasonText"></p>
  </section>

  <section class="weekHeader">
    <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
  </section>

  <section id="calendarGrid" class="calendarGrid"></section>

  <section id="detailPanel" class="detailPanel">
    <div class="handle"></div>
    <div class="detailHead">
      <div>
        <div class="small">DAY DETAIL</div>
        <h3 id="detailTitle">日付を選択</h3>
      </div>
      <button id="closeDetail" type="button">閉じる</button>
    </div>

    <div class="infoGrid">
      <div><span>旧暦</span><strong id="detailLunar">-</strong></div>
      <div><span>六曜</span><strong id="detailRokuyo">-</strong></div>
      <div><span>干支</span><strong id="detailZodiac">-</strong></div>
    </div>

    <div class="eventBox">
      <div class="small">行事・メモ</div>
      <ul id="detailEvents"></ul>
    </div>

    <label class="memoLabel">予定メモ</label>
    <textarea id="memo" placeholder="この日の予定やメモを入力"></textarea>
    <button id="saveMemo" class="saveBtn" type="button">この端末に保存</button>
  </section>
</main>

<nav class="bottomNav">
  <button id="prevMonth" type="button">‹ 前月</button>
  <button id="todayBtn" type="button">1月へ</button>
  <button id="nextMonth" type="button">次月 ›</button>
</nav>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
