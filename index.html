<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>沖縄手帳＋ 2027</title>
  <meta name="description" content="いつもの沖縄手帳を、スマホでも。旧暦・六曜・沖縄行事・季節暦を確認できる沖縄手帳Web版プレ。">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="appHeader">
  <div class="brandMini">沖縄手帳＋ <span>2027</span></div>
</header>

<section class="hero">
  <div class="heroBg"></div>
  <div class="heroInner">
    <div class="heroText">
      <div class="eyebrow">OKINAWA TECHO PLUS</div>
      <h1>沖縄手帳＋ <span>2027</span></h1>
      <p class="lead">いつもの沖縄手帳を、スマホでも。</p>
      <p class="copy">旧暦・六曜・沖縄行事・季節暦を、毎日の予定と一緒に。沖縄の暮らしに寄り添う、Web版プレです。</p>
      <div class="featurePills">
        <div>旧暦</div><div>六曜</div><div>沖縄行事</div><div>季節暦</div>
      </div>
    </div>
    <div class="bookVisual">
      <div class="bookGlow"></div>
      <div class="bookCard"><img src="assets/okinawa-techo-cover.jpeg" alt="沖縄手帳 実物イメージ"></div>
    </div>
  </div>
</section>

<main id="app" class="app">
  <section class="installMini" id="installGuide">
    <button type="button">＋ ホーム画面に追加</button>
  </section>

  <section class="monthPanel">
    <div class="monthNav">
      <button id="prevMonth" type="button">‹ 前月</button>
      <button id="todayBtn" type="button">1月へ</button>
      <button id="nextMonth" type="button">次月 ›</button>
    </div>
    <div class="monthTitleArea">
      <div>
        <div class="small">2027 / OKINAWA TECHO＋</div>
        <h2 id="monthTitle">1月</h2>
        <p id="monthMeta">そーぐゎち / January</p>
      </div>
      <select id="monthSelect" aria-label="月を選択"></select>
    </div>
  </section>

  <section class="legendBox">
    <div><span class="dot gold"></span>行事あり</div>
    <div><span class="dot black"></span>予定メモあり</div>
  </section>

  <section class="weekHeader">
    <div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div><div>日</div>
  </section>

  <section id="calendarGrid" class="calendarGrid"></section>

  <section class="monthlyInfo">
    <div class="small">今月の行事・季節暦</div>
    <ul id="seasonText"></ul>
  </section>

  <div id="detailBackdrop" class="detailBackdrop"></div>

  <section id="detailPanel" class="detailPanel">
    <div class="handle"></div>
    <div class="detailHead">
      <div>
        <div class="small">DAY DETAIL</div>
        <h3 id="detailTitle">日付を選択</h3>
      </div>
      <button id="closeDetail" type="button">閉じる</button>
    </div>
    <div class="infoGrid">
      <div><span>旧暦</span><strong id="detailLunar">-</strong></div>
      <div><span>六曜</span><strong id="detailRokuyo">-</strong></div>
      <div><span>干支</span><strong id="detailZodiac">-</strong></div>
    </div>
    <div class="eventBox">
      <div class="small">行事・記念日</div>
      <ul id="detailEvents"></ul>
    </div>
    <label class="memoLabel">予定メモ</label>
    <textarea id="memo" placeholder="この日の予定やメモを入力"></textarea>
    <button id="saveMemo" class="saveBtn" type="button">この端末に保存</button>
  </section>
</main>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
